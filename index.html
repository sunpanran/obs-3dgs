<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%234b8cff'/%3E%3C/svg%3E" />

    <canvas id="viewport" aria-label="3D Gaussian Splatting viewport"></canvas>

          <small>OBS · 3DGS</small>

        </div>
        <span id="debug-ready" class="ready-dot"></span>
      </header>
      <dl id="debug-values"></dl>
    </aside>
    <script type="module" src="/src/main.ts"></script>
