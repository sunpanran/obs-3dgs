name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: web-runtime-and-sbom
          if-no-files-found: error
          path: |
            dist/web
            dist/sbom.cdx.json

  windows:
    name: Windows x64 plugin
    # Match the pinned Visual Studio 17 2022 generator used by the local build.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sbom
      - run: cmake --preset windows-ci-x64
      - run: cmake --build --preset windows-ci-x64 --parallel
      - run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: obs-3dgs-windows-x64
          if-no-files-found: error
          path: |
            release/obs-3dgs-0.1.0-beta.1-windows-x64.zip
            release/obs-3dgs-0.1.0-beta.1-windows-x64.zip.sha256

  macos:
    name: macOS Universal plugin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sbom
      - run: cmake --preset macos-ci
      - run: cmake --build --preset macos-ci --parallel
      - run: ctest --test-dir build_macos -C RelWithDebInfo --output-on-failure
      - name: Native crash diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for report in (Path.home() / "Library/Logs/DiagnosticReports").glob("obs-3dgs*.ips"):
              print(report.name)
              print(report.read_text())
          PY
      - run: zsh scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: obs-3dgs-macos-universal
          if-no-files-found: error
          path: |
            release/obs-3dgs-0.1.0-beta.1-macos-universal.zip
            release/obs-3dgs-0.1.0-beta.1-macos-universal.zip.sha256

  release:
    name: Draft unified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: obs-3dgs-*
          path: release-files
          merge-multiple: true
      - name: Create draft with both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" release-files/*.zip release-files/*.sha256 \
            --verify-tag --draft --prerelease --title "obs-3dgs $version" \
            --notes-file "docs/releases/$version.md"
